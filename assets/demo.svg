<svg xmlns="http://www.w3.org/2000/svg" width="900" height="182" viewBox="0 0 900 182" role="img" aria-label="PHP CSP Audit — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="182" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="182" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">PHP CSP Audit — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#1f2937">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.77s steps(17) 0.60s forwards" fill="#e5e7eb">./csp-audit.php .</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.67s forwards" fill="#94a3b8">default-src &apos;self&apos;; script-src &apos;self&apos; js/app.js; style-src &apos;self&apos; &apos;unsafe-in…</text>
<g class="l" style="animation:show .01s 2.24s forwards"><text x="28" y="152" fill="#1f2937">❯</text><rect class="cur" x="50" y="137" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
